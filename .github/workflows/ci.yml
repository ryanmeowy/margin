name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: 类型检查
        run: make check

      - name: 纯函数自测
        run: make test

      - name: 打包 .app
        run: |
          make app
          ditto -c -k --sequesterRsrc --keepParent build/Margin.app Margin-arm64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Margin-arm64
          path: Margin-arm64.zip
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          make app
          ditto -c -k --sequesterRsrc --keepParent build/Margin.app "Margin-${GITHUB_REF_NAME}-arm64.zip"
      - uses: softprops/action-gh-release@v2
        with:
          files: Margin-*-arm64.zip
